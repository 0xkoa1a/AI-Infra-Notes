project:
  type: website
  output-dir: ../_site

website:
  title: "AI Infra 知识库"
  description: "AI 推理与训练基础设施知识库"
  reader-mode: true
  search:
    location: sidebar
    type: textbox
  navbar:
    left:
      - href: index.qmd
        text: 首页
    right:
      - icon: github
        href: https://github.com/0xkoa1a/Inference-Infra-Notes
        aria-label: GitHub
  sidebar:
    style: floating
    collapse-level: 2
    contents: auto
  page-footer:
    left: "本地生成 · 知识与源码自持"
    right: "由 Quarto 渲染"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    toc-title: "本页目录"
    toc-location: right
    number-sections: false
    code-copy: true
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true

execute:
  enabled: false

lang: zh
