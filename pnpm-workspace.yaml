allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  vue-demi: true

overrides:
  "js-yaml@>=3.0.0 <3.15.2": 3.15.2
  "js-yaml@>=5.0.0 <5.4.1": 5.4.1
  "markdown-it@>=14.0.0 <14.3.1": 14.3.1
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  # argparse 2 retains the v1 CLI API and removes vulnerable sprintf-js.
  "js-yaml@3.15.2>argparse": 2.0.1
  "undici@>=7.0.0 <7.29.1": 7.29.1

# The current VuePress rc line mixes immediately adjacent core and markdown-it
# peer declarations. These exact versions are pinned and fully validated here.
peerDependencyRules:
  allowedVersions:
    "@vuepress/bundler-vite": 2.0.0-rc.31
    markdown-it: 15.0.1
    vuepress: 2.0.0-rc.31
